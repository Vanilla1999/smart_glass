# Docmancer documentation manifest for smart_glasses
# Prefetch dependency docs for key libraries

version: 1

targets:
  - library: flutter_bloc
    ecosystem: pub
    version: 8.1.6
    docs_url_template: https://pub.dev/documentation/{library}/{version}/
    allowed_domains:
      - pub.dev
    seed_urls:
      - https://pub.dev/documentation/flutter_bloc/8.1.6/flutter_bloc/BlocProvider-class.html
      - https://pub.dev/documentation/flutter_bloc/8.1.6/flutter_bloc/BlocBuilder-class.html
      - https://pub.dev/documentation/flutter_bloc/8.1.6/flutter_bloc/BlocListener-class.html

