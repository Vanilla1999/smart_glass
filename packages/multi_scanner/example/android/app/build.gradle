plugins {
    id "com.android.application"
    id "kotlin-android"
    id "dev.flutter.flutter-gradle-plugin"
}

android {
    namespace = "com.example.multi_scanner_example"

    compileSdk flutter.compileSdkVersion
    ndkVersion flutter.ndkVersion

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    buildFeatures {
        aidl = true
        buildConfig = true
    }

    sourceSets {
        main.java.srcDirs += 'src/main/kotlin'
    }

    def uac4Props = new Properties()
    def uac4PropsFile = rootProject.file("uac4.properties")
    if (uac4PropsFile.exists()) {
        uac4PropsFile.withInputStream { uac4Props.load(it) }
    }
    def uac4AppKey = uac4Props.getProperty("UAC4_APP_KEY") ?: System.getenv("UAC4_APP_KEY") ?: ""
    def uac4AppSecret = uac4Props.getProperty("UAC4_APP_SECRET") ?: System.getenv("UAC4_APP_SECRET") ?: ""
    def uac4Udid = uac4Props.getProperty("UAC4_UDID") ?: System.getenv("UAC4_UDID") ?: ""

    defaultConfig {
        applicationId "com.example.multi_scanner_example"
        minSdkVersion 27
        targetSdkVersion flutter.targetSdkVersion
        versionCode flutter.versionCode
        versionName flutter.versionName
        buildConfigField("String", "UAC4_APP_KEY", "\"$uac4AppKey\"")
        buildConfigField("String", "UAC4_APP_SECRET", "\"$uac4AppSecret\"")
        buildConfigField("String", "UAC4_UDID", "\"$uac4Udid\"")
    }

    buildTypes {
        release {
            signingConfig signingConfigs.debug
        }
    }
}

kotlin {
    compilerOptions {
        jvmTarget = org.jetbrains.kotlin.gradle.dsl.JvmTarget.JVM_17
    }
}

flutter {
    source '../..'
}

dependencies {
    implementation("com.google.android.material:material:1.12.0")
    implementation(fileTree("libs"))
    implementation("androidx.core:core-ktx:1.13.1")
    implementation("androidx.appcompat:appcompat:1.7.0")
}
