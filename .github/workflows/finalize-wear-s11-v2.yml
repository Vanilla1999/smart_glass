name: Finalize Wear S11 source

on:
  push:
    branches:
      - refactor/wear-runtime-route-observation
    paths:
      - .github/workflows/finalize-wear-s11-v2.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/wear-runtime-route-observation
          fetch-depth: 0
      - name: Apply reviewed transform and self-delete
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/modules/wear/services/wear_barcode_dispatcher.dart')
          source = path.read_text()
          needle = (
              '        semanticReceipt.rejectReason != WearDispatchRejectReason.unsupported ||\n'
              '        _authority.state.sessionEpoch != sessionEpoch ||'
          )
          replacement = (
              '        semanticReceipt.rejectReason != WearDispatchRejectReason.unsupported ||\n'
              '        _authority.isAuthorized ||\n'
              '        screen != WearScreenId.main ||\n'
              '        _authority.state.sessionEpoch != sessionEpoch ||'
          )
          if needle in source:
              source = source.replace(needle, replacement, 1)
              path.write_text(source)
          elif '_authority.isAuthorized ||' not in source or 'screen != WearScreenId.main ||' not in source:
              raise SystemExit('reviewed fallback insertion point not found')

          for workflow in (
              '.github/workflows/finalize-wear-s11.yml',
              '.github/workflows/finalize-wear-s11-v2.yml',
          ):
              candidate = Path(workflow)
              if candidate.exists():
                  candidate.unlink()
          PY
      - name: Commit reviewed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(wear): bound unsupported barcode fallback to pre-auth main"
          git push origin HEAD:refactor/wear-runtime-route-observation
