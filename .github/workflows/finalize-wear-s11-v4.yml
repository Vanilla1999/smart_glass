name: Finalize Wear S11 robustly

on:
  push:
    branches:
      - refactor/wear-runtime-route-observation
    paths:
      - .github/workflows/finalize-wear-s11-v4.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/wear-runtime-route-observation
          fetch-depth: 0
      - name: Apply reviewed regex transforms
        run: |
          python3 - <<'PY'
          import re
          from pathlib import Path

          controller = Path('lib/modules/wear/application/wear_flow_controller.dart')
          source = controller.read_text()
          flush_pattern = re.compile(
              r"  Future<void> flushPendingNavigation\(\) async \{\n"
              r"\s+final WearNavigationRequest\? request = _state\.pendingNavigation;\n"
              r"\s+if \(request == null \|\| _uiLifecycle != WearUiLifecycle\.active\) return;"
          )
          flush_replacement = """  Future<void> flushPendingNavigation() async {
            final WearPendingNavigation? pending =
                _authority.payload.navigation.pending;
            if (pending == null || _uiLifecycle != WearUiLifecycle.active) return;
            final WearNavigationRequest? legacyRequest = _state.pendingNavigation;
            final WearNavigationRequest request = WearNavigationRequest(
              requestId: pending.requestId,
              screen: pending.screen,
              extra: legacyRequest?.screen == pending.screen
                  ? legacyRequest?.extra
                  : null,
              replaceCurrent: pending.kind == WearPendingNavigationKind.replace,
              popCurrent: pending.kind == WearPendingNavigationKind.pop,
            );"""
          source, count = flush_pattern.subn(flush_replacement, source, count=1)
          if count != 1 and 'final WearPendingNavigation? pending =' not in source:
              raise SystemExit('aggregate flush transform failed')
          source = source.replace(
              'if (_state.pendingNavigation?.requestId == request.requestId) {',
              'if (_authority.payload.navigation.pending?.requestId == request.requestId) {',
              1,
          )

          ack_pattern = re.compile(
              r"  bool acknowledgeNavigation\(\{\n"
              r"\s+required int requestId,\n"
              r"\s+required WearScreenId screen,\n"
              r"\s+\}\) \{\n"
              r"\s+final WearNavigationRequest\? request = _state\.pendingNavigation;\n"
              r"\s+if \(request == null \|\|\n"
              r"\s+request\.requestId != requestId \|\|\n"
              r"\s+request\.screen != screen\) \{\n"
              r"\s+return false;\n"
              r"\s+\}\n"
              r"\s+print\('\[WearFlowController\] navigation acknowledged request=\$request'\);"
          )
          ack_replacement = """  bool acknowledgeNavigation({
            required int requestId,
            required WearScreenId screen,
          }) {
            final WearPendingNavigation? pending =
                _authority.payload.navigation.pending;
            if (pending == null ||
                pending.requestId != requestId ||
                pending.screen != screen) {
              return false;
            }
            print('[WearFlowController] navigation acknowledged request=$pending');"""
          source, count = ack_pattern.subn(ack_replacement, source, count=1)
          if count != 1 and 'navigation acknowledged request=$pending' not in source:
              raise SystemExit('aggregate acknowledgement transform failed')
          controller.write_text(source)

          dispatcher = Path('lib/modules/wear/services/wear_barcode_dispatcher.dart')
          barcode = dispatcher.read_text()
          fallback_pattern = re.compile(
              r"(semanticReceipt\.rejectReason != WearDispatchRejectReason\.unsupported \|\|\n)"
              r"(\s+)(_authority\.state\.sessionEpoch != sessionEpoch \|\|)"
          )
          if '_authority.isAuthorized ||' not in barcode:
              barcode, count = fallback_pattern.subn(
                  r"\1\2_authority.isAuthorized ||\n\2screen != WearScreenId.main ||\n\2\3",
                  barcode,
                  count=1,
              )
              if count != 1:
                  raise SystemExit('bounded barcode fallback transform failed')
              dispatcher.write_text(barcode)

          for workflow in Path('.github/workflows').glob('finalize-wear-s11*.yml'):
              workflow.unlink()
          PY
      - name: Commit reviewed source
        run: |
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add -A
          git commit -m "fix(wear): deliver aggregate pending navigation"
          git push origin HEAD:refactor/wear-runtime-route-observation
