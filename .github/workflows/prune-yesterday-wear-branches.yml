name: Prune temporary Wear branches

on:
  push:
    branches:
      - experiment/aligned-audio-frontend
    paths:
      - .github/workflows/prune-yesterday-wear-branches.yml

permissions:
  contents: write

jobs:
  prune:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Delete temporary Wear refs
        shell: bash
        run: |
          set -euo pipefail
          branches=(
            'fix/wear-runtime-barcode-scanner-stabilization'
            'fix/wear-stack-review-findings'
            'refactor/wear-controller-projection-only'
            'refactor/wear-feature-phone-ui-effects'
            'refactor/wear-lifecycle-input-source'
            'refactor/wear-phone-aggregate-projection'
            'refactor/wear-runtime-control-state'
            'refactor/wear-runtime-presentation-state'
            'refactor/wear-runtime-route-observation'
            'refactor/wear-session-navigation-state'
            'refactor/wear-status-overlay-slice'
            'refactor/wear-voice-clarification-slice'
          )
          for branch in "${branches[@]}"; do
            if git ls-remote --exit-code --heads origin "refs/heads/$branch" >/dev/null 2>&1; then
              git push origin --delete "$branch"
            fi
          done
