name: Apply Wear S12 scan route cleanup

on:
  push:
    branches:
      - refactor/wear-feature-phone-ui-effects
    paths:
      - .github/workflows/apply-wear-s12-route-cleanup.yml

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: refactor/wear-feature-phone-ui-effects
          fetch-depth: 0
      - name: Remove scan route business snapshots
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path

          path = Path('lib/modules/wear/runtime/wear_runtime_scan_slice.dart')
          text = path.read_text(encoding='utf-8')

          old_import = "import 'package:smart_glasses/modules/wear/application/wear_product_select_args.dart';\n"
          if text.count(old_import) != 1:
              raise SystemExit('scan product args import marker mismatch')
          text = text.replace(old_import, '')

          old_entry = """      } else if (intent.extra is WearProductSelectArgs) {
        final WearProductSelectArgs args =
            intent.extra as WearProductSelectArgs;
        entered = scan.copyWith(
          phase: WearScanTaskPhase.selecting,
          screen: WearScreenId.productSelect,
          barcode: args.barcode,
          products: args.products,
          focusedIndex: 0,
          clearStatus: true,
        );
      } else if (scan.phase == WearScanTaskPhase.selecting &&
"""
          new_entry = """      } else if (scan.phase == WearScanTaskPhase.selecting &&
"""
          if text.count(old_entry) != 1:
              raise SystemExit('scan enter route-extra marker mismatch')
          text = text.replace(old_entry, new_entry)

          old_selection = """  ) {
    final WearProductSelectArgs args = WearProductSelectArgs(
      barcode: scan.barcode ?? '',
      products: scan.products,
    );
    return _navigate(
      state,
      aggregate,
      features,
      scan,
      screen: WearScreenId.productSelect,
      extra: args,
    );
  }

  WearReduction _enterStatus(
"""
          new_selection = """  ) {
    return _navigate(
      state,
      aggregate,
      features,
      scan,
      screen: WearScreenId.productSelect,
    );
  }

  WearReduction _enterStatus(
"""
          if text.count(old_selection) != 1:
              raise SystemExit('product selection route-extra marker mismatch')
          text = text.replace(old_selection, new_selection)
          path.write_text(text, encoding='utf-8')
          PY
      - name: Commit cleanup and remove workflow
        shell: bash
        run: |
          git rm .github/workflows/apply-wear-s12-route-cleanup.yml
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add lib/modules/wear/runtime/wear_runtime_scan_slice.dart
          git commit -m "refactor(wear): remove scan business route extras"
          git push origin HEAD:refactor/wear-feature-phone-ui-effects
